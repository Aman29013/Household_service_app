{% extends "layout1.html" %}

{% block title %}
Update Service Dashboard
{% endblock %}

{% block content %}
<div class="center">
  <h3 style="margin-top:40px;">Edit Service</h3>
</div>
<div class="input_forms" style="background-color:azure;">


  <form method="POST" action="/update/{{admin_username}}/{{service.service_id}}">
    <div class="mb-3">
      <label for="name">Service Name:</label><br>
      <select name="service_name" class="form-control" id="name" required>
        <option value="" disabled {% if not service.service_name %}selected{% endif %}>Select Your Service</option>
        <option value="Electrician" {% if service.service_name=="Electrician" %}selected{% endif %}>Electrician</option>
        <option value="Plumber" {% if service.service_name=="Plumber" %}selected{% endif %}>Plumber</option>
        <option value="Painter" {% if service.service_name=="Painter" %}selected{% endif %}>Painter</option>
        <option value="Carpenter" {% if service.service_name=="Carpenter" %}selected{% endif %}>Carpenter</option>
        <option value="Cleaner" {% if service.service_name=="Cleaner" %}selected{% endif %}>Cleaner</option>

      </select>

    </div>
    <div class="mb-3">
      <label for="base_price">Base-Price:</label><br>
      <input type="text" id="base_price" name="base_price" value="{{service.base_price}}" required>
    </div>
    <button type="submit" class="btn btn-outline-success">Update</button>
    <span><a role="button" class="btn btn-outline-warning" href="/show_admin/{{ admin_username }}">Cancel</a></span>

  </form>
</div>
{% endblock %}
