<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}
    
{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles/main.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
</head>

<body>
  <div class="my_container">
    <div class="my_panel navwidth" >
      <nav class="navbar navbar-expand-lg" style="background-color:rgb(212, 241, 248);">
          <div class="container-fluid">
            <div class="collapse navbar-collapse" id="navbarText">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="/show_admin/{{admin_username}}">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/admin_summary/{{admin_username}}">Summary</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/admin_search/{{admin_username}}">Search</a>
                </li>
              
              
                <li class="nav-item">
                  <a class="nav-link" href="/">Logout</a>
                </li>
              </ul>
              <form  method="POST" action="/admin_search/{{admin_username}}" class="d-flex" role="search">
                <input class="form-control me-2" name="search" type="search" placeholder="Search" aria-label="Search">
                <button style="margin-right: 20px !important;" class="btn btn-outline-success" type="submit">Search</button>
              </form>
              
              <span class="navbar-text">
                Welcome <b>"{{admin_username}}"</b>
              </span>
              
    
            </div>
            
          </div>
          
        </nav>
        
    </div>
    
    <br>
    {% block content %}
    
{% endblock %}
 
    
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
