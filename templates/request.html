{% extends "layout1.html" %}

{% block title %}
    Request
{% endblock %}

{% block content %}
<div class="center">
    <h3 style="margin-top:40px;">Request for {{ service.service_name }}</h3>
  </div>
  <div class="input_forms"style="background-color:azure;">
    
    
    <form method="POST" action="/request/{{cust_username}}/{{service.service_id}}">
      <div class="mb-3">
        <h5>Service-Name : {{service.service_name}}</h5>
        <br>
        <p>Offer a base-price to Proffessional</p>
        <br>
        <label for="base_price">Base-Price:</label><br>
        <br>
        
        <input type="number" value="{{service.base_price}}" name="base_price" id="base_price" required>  <br>
        <br>
        
      </div>
      <br>
      
      <button type="submit" class="btn btn-outline-success">Request</button>
      <span><a  role="button" class="btn btn-outline-warning" href="/customer_dashboard/{{cust_username}}" >Return to Home</a></span>
      
    </form>
  </div>
  {% endblock %}
